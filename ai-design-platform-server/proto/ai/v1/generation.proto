syntax = "proto3";

package ai.v1;

option go_package = "ai-design-platform/gen/go/ai/v1;aiv1";

// GenerationService handles AI text/code generation with streaming.
service GenerationService {
  // StreamGenerate performs LLM generation, returning tokens as they arrive.
  rpc StreamGenerate(GenerateRequest) returns (stream GenerateResponse);

  // CancelGeneration stops an in-progress generation.
  rpc CancelGeneration(CancelRequest) returns (CancelResponse);
}

message GenerateRequest {
  string generation_id = 1;
  string model = 2;
  repeated Message messages = 3;
  GenerationConfig config = 4;
  map<string, string> metadata = 5;
}

message Message {
  string role = 1;     // "system" | "user" | "assistant"
  string content = 2;
}

message GenerationConfig {
  double temperature = 1;
  int32 max_tokens = 2;
  double top_p = 3;
  repeated string stop_sequences = 4;
  bool enable_thinking = 5;
}

message GenerateResponse {
  oneof payload {
    Token token = 1;
    ToolCall tool_call = 2;
    GenerationComplete complete = 3;
    GenerationError error = 4;
    GraphEvent graph_event = 5;
  }
}

message Token {
  string text = 1;
  int32 index = 2;
  string reasoning_content = 3;  // GLM thinking process text
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3;  // JSON string
}

message GenerationComplete {
  string finish_reason = 1;  // "stop" | "length" | "cancelled"
  Usage usage = 2;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

message GenerationError {
  string code = 1;
  string message = 2;
}

message GraphEvent {
  string event_type = 1;    // "stage_start" | "stage_complete" | "stage_rollback"
                            // | "e2e_execute" | "e2e_case_result" | "e2e_complete"
                            // | "human_confirm_required" | "loop_warning" | "loop_break"
  string stage = 2;         // "analysis" | "design" | "code" | "review" | "e2e"
  string data = 3;          // JSON-encoded payload (varies by event_type)
}

message CancelRequest {
  string generation_id = 1;
  string reason = 2;
}

message CancelResponse {
  bool success = 1;
}
